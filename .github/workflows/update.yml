yaml
name: update
on:
  schedule:
    - cron: '30 22 * * 0-4'
    - cron: '*/20 0-6 * * 1-5'
    - cron: '30 11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: brief 또는 watch
        default: watch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install yfinance requests pandas lxml
      - name: 실행
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "30 22 * * 0-4" ]; then MODE=brief; else MODE=watch; fi
          fi
          python main.py --mode "$MODE"
      - name: 저장
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "update" && git push)
